server {
    listen 80;
    server_name _;

    # Serve React SPA static files
    root /usr/share/nginx/html;
    index index.html;

    # React Router — always serve index.html for unknown paths (SPA routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy all /api requests to the Spring Boot backend
    # This means VITE_API_BASE_URL doesn't need to be hardcoded at build time
    location /api/ {
        proxy_pass         http://backend:8085;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Allow large file uploads (Excel export, etc.)
        client_max_body_size 25M;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # Security headers
    add_header X-Frame-Options         "DENY"            always;
    add_header X-Content-Type-Options  "nosniff"         always;
    add_header X-XSS-Protection        "1; mode=block"   always;
    add_header Referrer-Policy         "no-referrer"     always;

    # Cache static assets aggressively (Vite includes content hashes in filenames)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Don't cache index.html (so users always get the latest version)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
