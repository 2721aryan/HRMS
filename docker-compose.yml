version: '3.9'

# ─────────────────────────────────────────────────────────────────────────────
#  HRMS — Full Stack Docker Compose
#  Services: postgres · backend (Spring Boot) · frontend (React + Nginx)
#
#  USAGE:
#    1. Copy .env.example to .env and fill in values
#    2. docker compose up --build
#    3. Open http://localhost (frontend) or http://localhost:8085 (API direct)
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: hrms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hrms
      POSTGRES_USER: ${DB_USER:-hrms_user}
      POSTGRES_PASSWORD: ${DB_PASS:-hrms_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-hrms_user} -d hrms"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Not exposing port 5432 to host — only the backend container needs it
    # Uncomment below if you want to connect with a DB client like DBeaver
    # ports:
    #   - "5432:5432"

  # ── Spring Boot Backend ──────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hrms_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Database
      DB_URL: jdbc:postgresql://postgres:5432/hrms
      DB_USER: ${DB_USER:-hrms_user}
      DB_PASS: ${DB_PASS:-hrms_pass}
      # JWT — REQUIRED: generate with: openssl rand -base64 64
      JWT_SECRET: ${JWT_SECRET}
      # Mail (optional — leave blank to disable email notifications)
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASS: ${MAIL_PASS:-}
      # Spring profile
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
    # Not exposing 8085 to host — frontend Nginx proxies to it internally
    # Uncomment below if you want to hit the API directly
    # ports:
    #   - "8085:8085"
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── React Frontend (Nginx) ───────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hrms_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"

  # ── pgAdmin (optional, for DB inspection) ───────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: hrms_pgadmin
    restart: unless-stopped
    profiles:
      - tools   # Only starts when you run: docker compose --profile tools up
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@hrms.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  pgadmin_data:
  uploads_data:
